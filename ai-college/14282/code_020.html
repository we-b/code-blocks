<pre class="language-text"><code>Articleモデルにstatusのenumを設定してください。

- published（公開）= 1
- archived（アーカイブ）= 2

【要件】
- デフォルト値はdraft（0）
- enumの定義はモデルファイルに記述
- _prefixオプションを使用して、status_draft?のような形式でメソッドを生成</code></pre>
