<body>
<pre class="language-markdown"><code>## エラーハンドリング

### サイトにアクセスできない場合
- 3回までリトライ（5秒間隔）
- それでも失敗した場合は、該当サイトをスキップ
- レポートに「アクセス失敗」と記載

### 情報が取得できない場合
- 取得できなかった項目は「取得失敗」と記載
- 他の項目は通常通り処理を継続

### 検索フォームが見つからない場合
- 検索をスキップし、トップページの情報のみ取得
- レポートに「検索機能なし」と記載

### エラーログ
- エラーが発生した場合、レポート末尾に「エラーログ」セクションを追加</code></pre>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
