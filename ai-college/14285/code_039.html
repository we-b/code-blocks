<pre class="language-text"><code>CommentsControllerを作成してください。

【アクション】
- index: 指定した記事のコメント一覧を取得（新しい順）
- create: 指定した記事にコメントを作成
- destroy: コメントを削除

【注意】
- commentsはarticlesの入れ子リソース
- article_idはURLパラメータから取得

【レスポンス形式】
- 成功時: JSON形式でコメントデータを返す
- 失敗時: JSON形式でエラーメッセージを返す</code></pre>
