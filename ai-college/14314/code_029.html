<pre class="language-bash"><code>「問題を段階的に修正していきたいと思います。以下の順序で進めてください。

1. まず最も可能性の高い原因から1つだけ修正
2. 修正後、問題が解決したか動作確認
3. 解決していない場合は次の原因を1つだけ修正
4. 各修正の前後で動作テストを実行

修正を開始する前に、現在のコードをGitで保存してください。
また、修正内容と結果を記録として残してください。」</code></pre>
