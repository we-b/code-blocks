<pre class="language-bash"><code>現在のユーザー認証機能が複雑すぎて問題の特定が困難です。
以下の最小構成で動作するバージョンを作成してください。

【最小機能】
1. 固定のユーザー名とパスワードでのログイン
2. 成功時は単純な画面遷移のみ
3. エラー処理は最小限
4. データベース接続なし（最初はローカルデータで）

この最小構成で動作確認した後、以下の順序で段階的に機能を追加していきます。
1. データベース接続を追加
2. 動的なユーザー情報の取得を追加
3. エラーハンドリングを強化
4. セキュリティ機能を追加

各段階で動作確認を行い、問題が発生した段階で詳細分析を行います。</code></pre>
