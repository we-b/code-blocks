<pre class="language-bash"><code>以下の情報をJSON形式で返すAPIエンドポイントを /tasks/report に新規追加する。

レスポンス形式：JSON（camelCaseを使用し、既存APIの形式に合わせること）

レスポンスデータの詳細：
1. totalCount: 全タスクの総数。
2. countByStatus: ステータス(not_started, in_progress, completed)ごとのタスク数。
3. completionRate: 完了率 (完了タスク数 / 総タスク数) を小数点以下1桁のパーセンテージで返す。 (例: 33.3)</code></pre>
