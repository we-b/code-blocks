<body>
<pre class="language-sql"><code>CREATE POLICY &quot;カートは本人のみ操作可能&quot; ON public.cart_items -- SELECT, 
  INSERT, UPDATE, DELETE の全てに適用 FOR ALL -- 閲覧・更新・削除の対象を
  本人に限定 USING ( user_id = auth.uid() ) -- 作成・更新時に、必ず本人のIDが
  設定されるよう強制 WITH CHECK ( user_id = auth.uid() ); </code></pre>
