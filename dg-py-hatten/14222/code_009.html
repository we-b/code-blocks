<body>
<pre class="language-sql"><code>CREATE POLICY &quot;公開投稿は誰でも、自分の投稿は全て閲覧可能&quot;
ON public.posts
FOR SELECT
USING (
  -- 条件1：公開されているか
  is_published = true
  -- または
  OR
  -- 条件2：自分自身の投稿であるか
  user_id = auth.uid()
);</code></pre>
