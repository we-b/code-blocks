<pre class="language-bash"><code>FROM gradle:8.8-jdk21 AS build
WORKDIR /app
COPY . .
RUN gradle clean build -x test

FROM eclipse-temurin:21-alpine
COPY --from=build /app/build/libs/pictweet-0.0.1-SNAPSHOT.jar pictweet.jar
EXPOSE 8080
ENTRYPOINT [&quot;java&quot;, &quot;-jar&quot;, &quot;pictweet.jar&quot;, &quot;--spring.profiles.active=prod&quot;, &quot;--debug&quot;]</code></pre>
