<body>
<pre class="language-bash"><code># 変数に整数の値を代入
jshell&gt; int number = 7
number ==&gt; 7

# 変数numberの値に1を足し、numberに再代入する
jshell&gt; number = number + 1
number ==&gt; 8

# 変数を出力
jshell&gt; number
number ==&gt; 8</code></pre>
