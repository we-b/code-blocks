<body>
<pre class="language-ruby"><code>
def charge_card(money)
  if 1000 &lt; money &amp;&amp; 2000 &gt; money
    puts &#x27;5%のおまけがつきます&#x27;
  elsif 1000 &gt; money
    puts &#x27;3%のおまけがつきます&#x27;
  else
    puts &#x27;2000以下の金額を入力してください。&#x27;
  end
end

charge_card(300)
</code></pre>
