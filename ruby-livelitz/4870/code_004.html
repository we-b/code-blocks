<body>
<pre class="language-ruby line-numbers" data-line-offset="30" data-start="31"><code>it &#x27;passwordとpassword_confirmationが不一致では登録できない&#x27; do
 @user.password = &#x27;123456&#x27;
 @user.password_confirmation = &#x27;1234567&#x27;
 @user.valid?
 expect(@user.errors.full_messages).to include(&quot;Password confirmation doesn&#x27;t match Password&quot;)
end</code></pre>
