<body>
<pre class="language-java"><code>@GetMapping(&quot;/login&quot;)
public String showLoginWithError(@RequestParam(value = &quot;error&quot;, required = false) String error, Model model) {
  if (error != null) {
    model.addAttribute(&quot;loginError&quot;, &quot;Invalid email or password.&quot;);
  }
  return &quot;users/login&quot;;
}</code></pre>
