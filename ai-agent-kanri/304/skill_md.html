name: expense-report
description: 複数部署の経費CSVを読み込んで精算レポートを作成
---

フォルダ内の *_経費.csv にマッチするファイルをすべて読み込んでください。

各ファイルには日付、項目、金額、カテゴリの列があります。

以下の形式でレポートを作成してください：

## 経費精算レポート

### 部署別集計
（各部署の経費合計とカテゴリ内訳を表示）

### 全社集計
（全部署の合計金額）

### 予算超過アラート
（部署ごとの予算50万円を超えている場合は警告）
予算内の場合は「全部署、予算内です」と表示</code></pre>
