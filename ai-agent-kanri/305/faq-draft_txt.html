<pre class="language-text"><code># よくある質問（社内ポータル掲載案）

Q. 在宅勤務の日も通勤手当は支給されますか？
A. 通勤手当は出社日数に応じた実費精算です（旅費規程 第5条）。在宅勤務の日は対象になりません。定期券の購入は不要です。

Q. 育児休業中の社会保険料はどうなりますか？
A. 申出により免除されます。総務部から「育児休業等取得者申出書」をお送りしますので、休業開始が決まったらご連絡ください。

Q. 私用のPCを業務に使ってもよいですか？
A. 情報セキュリティ規程により原則禁止です。やむを得ない場合は、例外申請を情報システム部門長宛てに提出してください。</code></pre>
