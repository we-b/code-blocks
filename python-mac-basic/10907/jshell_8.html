<body>
<pre class="language-bash"><code># 直径10（整数のためintで定義）
jshell&gt; int tyokkei = 10
tyokkei ==&gt; 10

# 面積
jshell&gt; double menseki = (tyokkei / 2) * (tyokkei / 2) * 3.14
menseki ==&gt; 78.5

# 円周
jshell&gt; double ensyu = tyokkei * 3.14
ensyu ==&gt; 31.400000000000002</code></pre>
