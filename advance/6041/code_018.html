<body>
<pre class="language-ruby"><code>
class Vehicle
  def initialize(type)
    @type = type
  end

  def speed_limit
    if type == &#x27;車&#x27;
      puts &#x27;制限速度:60km&#x27;
    elsif type == &#x27;原付&#x27;
      puts &#x27;制限速度:30km&#x27;
    end
  end

  private

  attr_reader :type
end

vehicle = Vehicle.new(&#x27;車&#x27;)
vehicle.speed_limit</code></pre>
