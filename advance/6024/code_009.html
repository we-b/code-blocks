<pre class="language-ruby"><code>class Player &lt; CPU
  attr_reader :name, :gender, :vitality

  def get_occupy(args)
    @occupy = args[:occupy]
  end


  def run_skill
    # 委譲で他のクラスでメソッドを実行する
    occupy.run_skill
  end

  def attack
    puts &#x27;物理攻撃！相手に10HPのダメージ！！&#x27;
  end

  def defense
    puts &#x27;身を守る！10HPのダメージを軽減する！！&#x27;
  end
end</code></pre>
