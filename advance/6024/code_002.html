<pre class="language-ruby"><code>class Thieves &lt; CPU
  def run_steal
    puts &#x27;相手の回復剤を盗んだ！ 30HP回復します！！&#x27;
  end

  def attack
    raise &#x27;物理攻撃！相手に10HPのダメージ！！&#x27;
  end

  def defense
    raise &#x27;身を守る！10HPのダメージを軽減する！！&#x27;
  end
end
