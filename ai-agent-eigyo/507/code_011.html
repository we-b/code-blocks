<pre class="language-markdown"><code>## 使用例

### 例1: 通常の週次分析
ユーザー: 「/competitor-analysis」
アクション: 全10ステップを順番に実行
結果: data/output/ に全成果物が生成され、Viewerが起動する

### 例2: 特定企業のみ分析
ユーザー: 「/competitor-analysis --targets Notion,Todoist」
アクション: config.json からNotionとTodoistのみを対象に実行
結果: 2社の比較レポートが生成される</code></pre>
