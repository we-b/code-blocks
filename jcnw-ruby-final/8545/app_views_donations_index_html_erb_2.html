<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/line-highlight/prism-line-highlight.min.css" rel="stylesheet" />
    <style>
        body { margin: 0; padding: 0; background-color: #2d2d2d; }
        pre { margin: 0 !important; border-radius: 0; border: none; }
        .line-highlight { background: rgba(255, 255, 255, 0.1) !important; }
        .line-highlight::before,
        .line-highlight::after { display: none; }
    </style>
</head>
<body>
<pre class="language-erb" data-line="8"><code>&lt;% if user_signed_in? %&gt;
  &lt;%= current_user.name %&gt;
  &lt;%= link_to &#x27;ログアウト&#x27;, destroy_user_session_path, data: { turbo_method: :delete } %&gt;
&lt;% else %&gt;
  &lt;%= link_to &#x27;新規登録&#x27;, new_user_registration_path %&gt;
  &lt;%= link_to &#x27;ログイン&#x27;, new_user_session_path %&gt;
&lt;% end %&gt;
&lt;%= link_to &#x27;寄付する&#x27;, new_donation_path %&gt;</code></pre>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-markup-templating.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-erb.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/line-highlight/prism-line-highlight.min.js"></script>
</body>
</html>
