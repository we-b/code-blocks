<pre class="language-bash"><code>// 1は20より小さいか？
jshell&gt; 1 &lt; 20
$1 ==&gt; true

jshell&gt; 5 &lt;= 5
$1 ==&gt; true

jshell&gt; 1 &gt; 20
$1 ==&gt; false

//  5は5以上か？
jshell&gt; 5 &gt;= 5
$1 ==&gt; true

// 2 × 5は10と等しいか？
jshell&gt; 2 * 5 == 10

$1 ==&gt; false</code></pre>
