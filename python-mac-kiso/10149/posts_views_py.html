<pre class="language-python"><code>from django.shortcuts import render
from django.views import View
from .models import Post

# 一覧画面を表示する 
class IndexView(View):
  def get(self, request, *args, **kwargs):
    posts = Post.objects.all()
    return render(request, &#x27;posts/index.html&#x27;, {&#x27;posts&#x27;: posts})</code></pre>
