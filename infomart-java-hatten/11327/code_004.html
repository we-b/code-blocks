<body>
<pre class="language-java"><code>case class TweetLength(value: Int) {
  require(value &gt;= 1 &amp;&amp; value &lt;= 280)

  // 文字数をn文字だけ増やす例
  def add(n: Int): TweetLength = {
    val newLength = value + n
    if (newLength &gt; 280) {
      throw new IllegalArgumentException(&quot;Exceeded maximum tweet length&quot;)
    }
    copy(newLength)
  }
}</code></pre>
