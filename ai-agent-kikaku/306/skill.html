<pre class="language-text"><code>competitor-sites.txt を読み込んで、競合のポジショニングを整理するSkillを作ってください。
Skill名は positioning。
- 社ごとに「想定ターゲット」「主な訴求ポイント」「価格帯・プラン」を抽出する
- 各社を「価格帯（低〜高）」と「訴求の軸（機能・便利さ〜世界観・情緒）」の2軸で位置づける
- 自社（新生活セット、価格帯は中、訴求は便利さ寄り）との差分を書く
- 空いているポジションを2つ提案する
出力は「ポジショニング整理表」「2軸マップ（テキスト表現）」「自社との差分と所見」の3部構成で、Markdownで保存してください。</code></pre>
