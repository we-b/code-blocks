<pre class="language-python"><code>@register.simple_tag
def ad(ad_type, image_count):
    if ad_type == &quot;gif&quot;:
        ad_instance = Gif()
    elif ad_type == &quot;image&quot;:
        ad_instance = Image()
    elif ad_type == &quot;movie&quot;:
        ad_instance = Movie()
    return ad_instance.return_html(ad_type, image_count)</code></pre>
