<pre class="language-python"><code># アンダースコアで始まる関数は、クラス内部での利用を意図している
    def _construct_sentence(self):
        # 辞書の&#x27;main&#x27;キーに対応するストラテジの処理を呼び出す（委譲）
        self.elements[&#x27;main&#x27;].output_contents()
        
        # 辞書の中に&#x27;sub&#x27;キーがあれば、そのストラテジの処理も呼び出す
        if &#x27;sub&#x27; in self.elements:
            self.elements[&#x27;sub&#x27;].output_contents()</code></pre>
