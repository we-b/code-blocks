<body>
<pre class="language-python"><code># 引数なしで、&quot;Hello World&quot;という文字列を返すlambda式
say_hello = lambda: &quot;Hello World&quot;

# 作成したlambda式は、通常の関数と同じように呼び出せる
message = say_hello()
print(message)
#=&gt; Hello World</code></pre>
