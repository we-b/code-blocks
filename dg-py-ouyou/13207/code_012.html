<pre class="language-python"><code>class Content:
    # 委譲される関数（処理の実行者）
    def format_date_jp(self):
        return self.created_at.strftime(&quot;%Y年%m月%d日&quot;)

class Printer:
    # 委譲する関数（処理の依頼者）
    def get_formatted_date_jp(self):
        # 内部のcontentインスタンスに処理を任せる
        return self.content.format_date_jp()</code></pre>
