<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />

    <style>
        body { margin: 0; padding: 0; background-color: #2d2d2d; }
        pre { margin: 0 !important; border-radius: 0; border: none; }
        .line-highlight { background: rgba(255, 255, 255, 0.1) !important; }
        .line-highlight::before,
        .line-highlight::after { display: none; }
    </style>
</head>
<body>
<pre class="language-html"><code>&lt;form method=&quot;post&quot; action=&quot;{% url &#x27;change_password&#x27; %}&quot;&gt;
    {% csrf_token %}
    &lt;input type=&quot;password&quot; name=&quot;current_password&quot; placeholder=&quot;現在のパスワード&quot;&gt;
    &lt;input type=&quot;password&quot; name=&quot;new_password&quot; placeholder=&quot;新しいパスワード&quot;&gt;
    &lt;button type=&quot;submit&quot;&gt;変更する&lt;/button&gt;
&lt;/form&gt;</code></pre>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-markup.min.js"></script>

</html>
