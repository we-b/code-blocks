        body { margin: 0; padding: 0; background-color: #2d2d2d; }
        pre { margin: 0 !important; border-radius: 0; border: none; }
        .line-highlight { background: rgba(255, 255, 255, 0.1) !important; }

        .line-highlight::after { display: none; }

<body>
<pre class="language-python"><code>class LineNumberWriter(FileManagerDecorator):
    def __init__(self, real_writer):
        # super() を使って親クラスの __init__ メソッドを呼び出す
        super().__init__(real_writer)
        # その後で、子クラス独自の属性を定義する
        self.line_number = 1</code></pre>
