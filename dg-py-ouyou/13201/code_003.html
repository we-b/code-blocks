<pre class="language-python"><code>def choose_title(self):
    print(&#x27;気になる本を以下から選んでください&#x27;)
    for i, book in enumerate(self.books):
        print(f&quot;[{i}] 書名：{book[&#x27;name&#x27;]}&quot;)
    selected_title = self.books[int(input())]
    print(f&quot;{selected_title[&#x27;name&#x27;]}が選択されました&quot;)
    return selected_title</code></pre>
