<pre class="language-python"><code>def find_num(array, target):
    pushed = []
    for num in array:
        if num != target:
            continue  # ターゲットの値と等しくない場合は、何もしないで次のループへ
        pushed.append(num)
    print(pushed)

target = 2
find_num(array, target)</code></pre>
