<body>
<pre class="language-bash"><code># 1は20より小さいか？
irb(main):001:0&gt; 1 &lt; 20
=&gt; true

# 5は5以下か？
irb(main):002:0&gt; 5 &lt;= 5
=&gt; true

# 1は20より大きいか？
irb(main):003:0&gt; 1 &gt; 20
=&gt; false

# 5は5以上か？
irb(main):004:0&gt; 5 &gt;= 5
=&gt; true

# 2 × 5は10と等しいか？
irb(main):005:0&gt; 2 * 5 == 10
=&gt; true

# 10は20と等しいか？
irb(main):006:0&gt; 10 == 20
=&gt; false</code></pre>
