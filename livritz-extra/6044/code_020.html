<pre class="language-ruby"><code># 上司クラス
class Manager
 # updateメソッドの引数と内容を書き換え
 def update(name, salary)
   puts &quot;上司：#{name}さんの給料は#{salary}円です！&quot;
 end
end
# 経理担当クラス
class Accountant
 def update(name, salary)
   puts &quot;経理部門：#{name}さんの給料は#{salary}円です!&quot;
 end
end
