<pre class="language-ruby"><code>books = [
  { name: &#x27;算術&#x27;, writer: &#x27;ディオファントス&#x27; },

  { name: &#x27;ソクラテスの弁明&#x27;, writer: &#x27;プラトン&#x27; }
]

books.each do |book|
  puts &quot;タイトル:#{book[:name]} 著者:#{book[:writer]}&quot;
end</code></pre>
