<body>
<pre class="language-ruby"><code>require &#x27;benchmark&#x27;

Benchmark.bm do |r|
  r.report &quot;計算量がO(n)の場合\n&quot; do
    1.upto(999) do |i|
      puts &quot;#{i} + #{1000 - i} = 1000&quot; 
    end
  end
end</code></pre>
