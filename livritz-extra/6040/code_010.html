<body>
<pre class="language-ruby"><code>class Country
  def official_language
    raise &quot;具象クラスで公用語を定義しましょう。&quot;
  end
  def currency
    raise &quot;具象クラスで通貨を定義しましょう。&quot;
  end
end

class Japan &lt; Country
  def official_language
    puts “日本語”
  end
  def currency
    puts &quot;日本円&quot;
  end
end

japan = Japan.new
japan.official_language
japan.currency</code></pre>
