    <style>
        body { margin: 0; padding: 0; background-color: #2d2d2d; }
        pre { margin: 0 !important; border-radius: 0; border: none; }
        .line-highlight { background: rgba(255, 255, 255, 0.1) !important; }

        .line-highlight::after { display: none; }

<body>
<pre class="language-ruby"><code>context &#x27;ツイート投稿ができないとき&#x27;do
  it &#x27;ログインしていないと新規投稿ページに遷移できない&#x27; do
    # トップページに遷移する
    visit root_path
    # 新規投稿ページへのボタンがないことを確認する
    expect(page).to have_no_content(&#x27;投稿する&#x27;)
  end
end</code></pre>
