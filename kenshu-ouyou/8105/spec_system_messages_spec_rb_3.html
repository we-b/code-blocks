    <style>
        body { margin: 0; padding: 0; background-color: #2d2d2d; }
        pre { margin: 0 !important; border-radius: 0; border: none; }

<body>
<pre class="language-ruby"><code>  # サインインする。@room_userに紐づくuserが生成されているため、@room_user.userというアソシエーションの記述で取得できる
  sign_in(@room_user.user)

  # 作成されたチャットルームへ遷移する。roomについても上と同様。最終的にnameカラムの値を取得しclick_onメソッドの引数にして、チャットルームの名前のリンクをクリックしている
  click_on(@room_user.room.name)</code></pre>
