    <style>
        body { margin: 0; padding: 0; background-color: #2d2d2d; }
        pre { margin: 0 !important; border-radius: 0; border: none; }
        .line-highlight { background: rgba(255, 255, 255, 0.1) !important; }
        .line-highlight::before,
        .line-highlight::after { display: none; }
    </style>
</head>
<body>
<pre class="language-ruby"><code>class TweetsController &lt; ApplicationController
  def search
    # DBからデータを取得する
    @tweets = Tweet.all
    # もし検索ワードがあれば、検索ワードを含むデータのみを曖昧検索で取得し、@tweetsに代入し直す
    if params[:keyword] != &quot;&quot;
      @tweets = Tweet.where(&#x27;text LIKE(?)&#x27;, &quot;%#{params[:keyword]}%&quot;)
    end
  end
end</code></pre>
