<body>
<pre class="language-text"><code>これから次の作業をAIに任せます。実行前に、安全面を点検してください。
・作業内容: 〔ここに書く〕
・扱う情報: 〔公開／社内／顧客・個人情報／認証情報 など〕
・触れる範囲: 〔フォルダ・データベース・外部サービス〕

点検してほしいこと:
1. この作業の危険度は4段階のどれか
2. 渡してよい情報か（伏せるべきものはないか）
3. 取り返しのつかない操作が含まれていないか
4. 戻せる状態（バックアップ・ブランチ）はあるか
5. 人の確認・承認をはさむべき箇所はどこか</code></pre>
