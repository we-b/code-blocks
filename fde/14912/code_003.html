<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />

    <style>
        body { margin: 0; padding: 0; background-color: #2d2d2d; }
        pre { margin: 0 !important; border-radius: 0; border: none; }
        .line-highlight { background: rgba(255, 255, 255, 0.1) !important; }
        .line-highlight::before,
        .line-highlight::after { display: none; }
    </style>
</head>
<body>
<pre class="language-text"><code>firstapp-frontend/
├── app/              ← ページを配置するフォルダ
│   ├── layout.js     ← 全ページ共通のレイアウト
│   ├── page.js       ← トップページ（/）
│   └── globals.css   ← 全体に適用されるスタイル
├── public/           ← 画像などの静的ファイル
├── package.json      ← プロジェクトの設定と依存ライブラリの一覧
└── next.config.mjs   ← Next.jsの設定ファイル</code></pre>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-text.min.js"></script>
</body>
</html>
