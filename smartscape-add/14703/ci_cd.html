<pre class="language-text"><code>【バックエンド】
PR作成 → CI（JUnitテスト）→ mainにマージ → CD（GitHub Actions → Render Deploy Hook → Renderにデプロイ）

【フロントエンド】
PR作成 → プレビューデプロイ → mainにマージ → CD（Vercelが自動デプロイ）

【フルスタック変更時のデプロイ順序】
1. バックエンドをデプロイ（後方互換性を保つ）
2. フロントエンドをデプロイ</code></pre>
