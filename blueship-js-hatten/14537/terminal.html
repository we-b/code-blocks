<html lang="ja">

    <meta charset="UTF-8">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />

    <style>
        body { margin: 0; padding: 0; background-color: #2d2d2d; }
        pre { margin: 0 !important; border-radius: 0; border: none; }
        .line-highlight { background: rgba(255, 255, 255, 0.1) !important; }
        .line-highlight::before,
        .line-highlight::after { display: none; }
    </style>
</head>
<body>
<pre class="language-bash"><code># task_checkerディレクトリがある場所に移動する
% cd ~/javascript_projects

# task_checkerをtask_checker_frontにリネームする
% mv task_checker task_checker_front

# 親ディレクトリtask_checkerを作成する
% mkdir task_checker

# task_checker_frontを親ディレクトリの中に移動する
% mv task_checker_front task_checker/</code></pre>
