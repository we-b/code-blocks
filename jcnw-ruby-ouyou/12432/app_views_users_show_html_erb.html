<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />

    <style>
        body { margin: 0; padding: 0; background-color: #2d2d2d; }
        pre { margin: 0 !important; border-radius: 0; border: none; }
        .line-highlight { background: rgba(255, 255, 255, 0.1) !important; }
        .line-highlight::before,
        .line-highlight::after { display: none; }
    </style>
</head>
<body>
<pre class="language-erb" data-start="1"><code>&lt;div class=&quot;contents row&quot;&gt;
  &lt;p&gt;&lt;%= @nickname %&gt;さんの投稿一覧&lt;/p&gt;
  &lt;% @tweets.each do |tweet| %&gt;
    &lt;div class=&quot;content_post&quot; style=&quot;background-image: url(&lt;%= tweet.image %&gt;);&quot;&gt;
      &lt;p&gt;&lt;%= tweet.text %&gt;&lt;/p&gt;
      &lt;span class=&quot;name&quot;&gt;&lt;%= tweet.name %&gt;&lt;/span&gt;
    &lt;/div&gt;
  &lt;% end %&gt;
&lt;/div&gt;</code></pre>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-markup-templating.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-erb.min.js"></script>
</body>
</html>
