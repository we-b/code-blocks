<body>
<pre class="language-text"><code>危険：サイトから情報を取って、そのまま外部に送信して
　　　→ 取得と送信がひと続き。ニセ指示が発動すると、そのまま持ち出される

安全：サイトから情報を取って、ファイルに保存して（いったん止める）
　　　→ 人が内容を確認してから、別の作業として送信する
　　　→ 取得と送信の間に人の目が入るので、持ち出しを止められる</code></pre>
