<pre class="language-text"><code>requirement_v2.md の要件に基づき、勤怠管理システムのデータモデルを
3つの異なるアプローチで設計し、「datamodels.md」に保存してください。

【3つのアプローチ】
案A: シンプル型（テーブル数最小、小規模向け）
案B: バランス型（正規化と実用性のバランス、一般向け）
案C: 高拡張性型（将来の変更に強い、大規模向け）

【出力内容】
各案ごとに以下を含めてください:
1. 設計思想と適用シーン
2. テーブル定義（YAML形式）
3. ER図（Mermaid記法）
4. メリット・デメリット
5. 推定される実装難易度</code></pre>
