<body>
<pre class="language-sql"><code>-- SELECT操作で、is_publishedという列にtrueと保存されている投稿だけを
許可するポリシー
CREATE POLICY &quot;公開投稿は誰でも閲覧可能&quot;
ON public.posts
FOR SELECT
USING ( is_published = true );</code></pre>
