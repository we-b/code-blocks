<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />

    <style>
        body { margin: 0; padding: 0; background-color: #2d2d2d; }
        pre { margin: 0 !important; border-radius: 0; border: none; }
        .line-highlight { background: rgba(255, 255, 255, 0.1) !important; }
        .line-highlight::before,
        .line-highlight::after { display: none; }
    </style>
</head>
<body>
<pre class="language-sql"><code>-- SELECT（閲覧）に対するポリシー
CREATE POLICY &quot;自身のプロフィールのみ閲覧可能&quot;
ON public.profiles
FOR SELECT
-- どの行を閲覧対象とするかのフィルター条件
USING ( id = auth.uid() );

-- UPDATE（更新）に対するポリシー
CREATE POLICY &quot;自身のプロフィールのみ更新可能&quot;
ON public.profiles
FOR UPDATE
-- どの行を更新対象とするかのフィルター条件
USING ( id = auth.uid() );</code></pre>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-sql.min.js"></script>
</body>
</html>
