<body>
<pre class="language-markdown"><code>## 出力形式オプション
引数に以下のキーワードが含まれる場合、出力を変更:
- `--no-screenshot`: スクリーンショットを省略
- `--csv`: CSVのみ出力（レポートなし）
- `--excel`: Excel形式でデータを出力

指定なしの場合:
- スクリーンショット + CSV + Markdownレポート（すべて出力）

例:
- `/competitor-report --csv` → CSVのみ出力
- `/competitor-report --no-screenshot` → スクリーンショットなしでレポート作成</code></pre>
