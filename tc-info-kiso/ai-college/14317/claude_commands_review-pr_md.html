<pre class="language-markdown"><code>---
description: PRをレビューします
argument-hint: [pr-number] [priority] [assignee]
allowed-tools: Bash(git *), Read
---

# PRレビュー

## 対象
- PR番号: #$1
- 優先度: $2
- 担当者: $3

## レビュー観点
以下の観点で PR #$1 をレビューしてください。

1. コード品質
2. テストカバレッジ
3. セキュリティ
4. パフォーマンス

優先度「$2」に応じた詳細度でレビューしてください。
レビュー結果は $3 に報告します。</code></pre>
