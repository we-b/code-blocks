        pre { margin: 0 !important; border-radius: 0; border: none; }
        .line-highlight { background: rgba(255, 255, 255, 0.1) !important; }

        .line-highlight::after { display: none; }

</head>
<body>
<pre class="language-javascript"><code>function getDiscount(user) {
  if (user.isPremium &amp;&amp; user.purchaseCount &gt; 10) {
    if (user.membershipYears &gt; 5) {
      return 0.3;
    } else {
      return 0.2;
    }
  } else if (user.isPremium) {
    return 0.1;
  } else if (user.purchaseCount &gt; 20) {
    return 0.05;
  }
  return 0;
}</code></pre>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
