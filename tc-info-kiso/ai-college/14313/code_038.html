<pre class="language-bash"><code>## アプリのゴール
### WHO（誰に）
月に2-4冊程度の本を読む読書好きの個人（20-40代の会社員・学生）
読んだ本を記録・管理したいが、既存アプリは複雑すぎると感じている

### WHAT（何を）
シンプルで使いやすい個人用の読書記録ツール
読んだ本を忘れない仕組み、おすすめ本をすぐに思い出せる機能

### HOW（どうなってもらいたいか）
本を読み終わるたびに記録する習慣を身につけ、
3ヶ月後には充実した読書履歴を振り返れるようになる</code></pre>
