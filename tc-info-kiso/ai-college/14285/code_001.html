<pre class="language-text"><code>ArticlesControllerを作成してください。

【アクション】
- index: 記事一覧を取得（statusがpublishedのもののみ、新しい順）
- show: 記事詳細を取得
- create: 記事を作成
- update: 記事を更新
- destroy: 記事を削除

【レスポンス形式】
- 成功時: JSON形式で記事データを返す
- 失敗時: JSON形式でエラーメッセージを返す（status: :unprocessable_entity）

【ストロングパラメータ】
- title, body, status, published_at を許可</code></pre>
