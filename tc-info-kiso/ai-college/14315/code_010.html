<pre class="language-markdown"><code># プロジェクト概要
## 目的
社内の勤怠管理を行うWebアプリケーションです。
従業員が出退勤を記録し、管理者が集計・承認を行います。

## 技術スタック
- フロントエンド: React 18 + TypeScript
- バックエンド: Node.js 20 + Express
- データベース: PostgreSQL 15
- 認証: JWT + bcrypt
- デプロイ: AWS ECS

## 主要な機能
1. 従業員の出退勤打刻
2. 勤怠データの一覧表示
3. 管理者による承認ワークフロー
4. 月次レポートの出力</code></pre>
