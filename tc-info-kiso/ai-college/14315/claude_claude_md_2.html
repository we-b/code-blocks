## 言語
- 回答は日本語で行ってください

## 安全に関するルール
- rm -rf コマンドは絶対に実行しない
- sudo コマンドは実行しない
- .envファイルの内容は表示も編集もしない
- 本番環境（production）に関する操作は行わない

## コーディングの基本方針

- 機密情報はハードコードしない
