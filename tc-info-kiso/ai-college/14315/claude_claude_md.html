<pre class="language-markdown"><code># グローバル設定

## 言語設定
- 回答は日本語で行う
- コードのコメントも日本語で書く

## 共通のコーディングスタイル
- インデントはスペース2つ
- 行末のセミコロンは必須
- 変数名は英語で命名

## セキュリティに関する注意
- パスワードやAPIキーをハードコードしない
- 機密情報は環境変数で管理する
- .envファイルは編集しない

## 一般的な禁止事項
- rm -rf コマンドは実行しない
- sudo コマンドは実行しない
- 本番環境のデータベースには接続しない</code></pre>
