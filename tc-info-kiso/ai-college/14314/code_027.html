<pre class="language-bash"><code>「エラーの原因を調査するために、以下の情報を確認してください。

1. ブラウザのコンソールにエラーメッセージが表示されていないか確認
2. アプリケーションの実行ログを確認
3. 最近の変更でビルドエラーが発生していないか確認
4. 問題が発生している機能に関連するファイルをチェック

各項目について、問題があれば詳細を教えてください。問題がない場合も
『問題なし』と報告してください。」
</code></pre>
