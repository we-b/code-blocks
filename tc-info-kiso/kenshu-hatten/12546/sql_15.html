<body>
<pre class="language-sql"><code>CREATE VIEW UsersInKanto(family_name, first_name, age, prefecture)
AS
SELECT family_name, first_name, age, prefecture
FROM users
WHERE prefecture IN(&quot;東京都&quot;, &quot;神奈川県&quot;, &quot;埼玉県&quot;, &quot;千葉県&quot;)
ORDER BY prefecture;</code></pre>
