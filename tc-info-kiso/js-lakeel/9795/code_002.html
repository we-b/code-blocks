<pre class="language-bash"><code>PCを使用する職業であるとします。
メモには普段ノートを使用していますが、紙であると以下のような問題があると感じています。
・ノート自体を忘れてしまうとメモした内容を確認できない
・ノートをなくしてしまうと機密情報が漏洩する可能性がある
・ノートから必要な情報を探し出すのに時間がかかる
・ノートを新しくしたときに前のノートに書いていたメモから必要なものを取り出し、転記する必要がある</code></pre>
