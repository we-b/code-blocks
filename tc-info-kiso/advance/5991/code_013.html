<body>
<pre class="language-ruby"><code>def quick_sort(ary)
  return ary if 【 ④ 】
  pivot = ary.shift
  smaller = [] # 基準値よりも小さい配列
  bigger  = [] # 基準値よりも大きい配列

  ary.each do |num|
    if 【 ① 】
      smaller &lt;&lt; num
    else
      bigger &lt;&lt; num
    end
  end
  【 ② 】+ [pivot] + 【 ③ 】
end

ary = [45, 245, 32]
p ary
p quick_sort(ary)</code></pre>
