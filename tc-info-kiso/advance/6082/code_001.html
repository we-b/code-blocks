<pre class="language-ruby"><code>def check_salary(member)
 # 残業代を計算している
 calculated_overtime_pay = member[:salary] + overtime_pay * ( member[:worktime] - 200 )

 if member[:worktime] &gt; 200
   member[:salary] = calculated_overtime_pay
   puts &quot;今月の給料は#{member[:salary]}円です&quot;
 else
   puts &quot;今月の給料は#{member[:salary]}円です&quot;
end</code></pre>
