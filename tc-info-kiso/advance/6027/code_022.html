<body>
<pre class="language-ruby"><code>def calc_price(price)
 tax = 0.1
 price += price * tax
 price.floor
end

product = { name: &#x27;コーラ&#x27;, price: 120 }

price = calc_price(product[:price])
puts &quot;#{product[:name]}の値段は#{price}円です。&quot;</code></pre>
