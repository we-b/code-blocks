<body>
<pre class="language-ruby"><code>class CPU
  attr_reader :name, :gender, :vitality

  def initialize(args)
    @name = args[:name]
    @gender = args[:gender]
    @vitality = args[:vitality]
  end

  def attack
    raise &quot;Called abstract method: attack&quot;
  end

  def defense
    raise &quot;Called abstract method: defense&quot;
  end
end</code></pre>
