 def search
   # searchの引数は下記の構成で、検索に必要な情報だけ送る。objは必須。
   elements = {
     obj: Tweet,
     keyword_column: &#x27;text&#x27;,
     keyword: params[:keyword],
     id_column: &#x27;genre_id&#x27;,
     id: params[:genre_id].to_i
   }
   @tweets = SearchService.search(elements)
 end
