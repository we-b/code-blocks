<pre class="language-ruby" data-line="7,8,9,10,11"><code>class UsersController &lt; ApplicationController

  def edit
  end

  def update
    if current_user.update(user_params)
      redirect_to root_path
    else
      render :edit
    end
  end

  private

  def user_params
    params.require(:user).permit(:name, :email)
  end
