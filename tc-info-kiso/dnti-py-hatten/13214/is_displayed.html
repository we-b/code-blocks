<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />

    <style>
        body { margin: 0; padding: 0; background-color: #2d2d2d; }
        pre { margin: 0 !important; border-radius: 0; border: none; }
        .line-highlight { background: rgba(255, 255, 255, 0.1) !important; }
        .line-highlight::before,
        .line-highlight::after { display: none; }
    </style>
</head>
<body>
<pre class="language-python"><code># 要素を探して、その表示状態を確認
signup_link = self.driver.find_element(By.LINK_TEXT, &quot;新規登録&quot;)
if signup_link.is_displayed():
    print(&quot;新規登録リンクが表示されています&quot;)
else:
    print(&quot;新規登録リンクが非表示です&quot;)

# assertTrueと組み合わせて使用
self.assertTrue(signup_link.is_displayed())  # 要素が表示されていることを確認</code></pre>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
</body>
</html>
